# Medical Appointment System - Spring Boot Configuration
server.port=8080

# Application Name
spring.application.name=online-medical-appointment-system

# Database Configuration (MySQL 8)
# Reads environment variables with fallback defaults for local development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medical_appointment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:CarePulseMedicalSecretKey2026SecureLongTokenStringForHmacSha256!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Vite frontend on port 5173)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
